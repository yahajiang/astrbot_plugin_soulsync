<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>心旅知音 SoulSync</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f6fa;--card:#fff;--border:#e2e5ec;--text:#1a1d26;--dim:#7a8299;--pink:#e84393;--green:#00b894;--blue:#3869d8;--red:#e55039;--orange:#f0932b;--purple:#6c5ce7}
body{background:var(--bg);color:var(--text);font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:20px}
.grid{display:grid;grid-template-columns:1fr 320px;gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.card-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)}
.card-hd h2{font-size:16px;font-weight:700}
.card-bd{padding:16px 18px}
.btn{border:1px solid var(--border);border-radius:6px;background:#fff;padding:6px 14px;cursor:pointer;font-size:13px;transition:.15s}
.btn:hover{background:#eef2ff;border-color:#b8c9f0;color:var(--blue)}
.btn.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.pri:hover{background:#2756b8}
.btn.dan{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{padding:4px 10px;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center}
.stat .ic{font-size:20px}.stat .v{font-size:20px;font-weight:800;margin-top:4px}.stat .l{font-size:11px;color:var(--dim)}
.c-pink .v{color:var(--pink)}.c-green .v{color:var(--green)}.c-blue .v{color:var(--blue)}.c-purple .v{color:var(--purple)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:.15s}
.row:hover{border-color:var(--blue);background:#f8faff}
.row-info{flex:1;min-width:0}
.row-name{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-id{font-size:11px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-stage{font-size:11px;color:var(--dim);margin-top:2px}
.bar{height:4px;background:#edf0f5;border-radius:2px;overflow:hidden;margin-top:4px}
.bar-fg{height:100%;border-radius:2px;transition:width .3s}
.row-r{text-align:center;min-width:48px}
.row-r .v{font-size:14px;font-weight:800}.row-r .l{font-size:10px;color:var(--dim)}
.empty{text-align:center;padding:40px;color:var(--dim)}
.empty .ic{font-size:36px;margin-bottom:8px}
.act{display:flex;flex-direction:column;gap:8px}
.act-btn{width:100%;padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer;font-weight:600;font-size:13px;text-align:left;transition:.15s}
.act-btn:hover{background:#f0f4ff;border-color:#b8c9f0;color:var(--blue)}
.act-btn .d{font-size:11px;font-weight:400;color:var(--dim)}
.act-btn.hot{background:linear-gradient(135deg,var(--pink),#fd79a8);color:#fff;border-color:var(--pink)}
.act-btn.hot:hover{background:linear-gradient(135deg,#d63384,#e84393)}
.sys{font-size:12px;color:var(--dim);line-height:1.8}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(10,14,24,.4);z-index:10}
.ov.on{display:flex}
.modal{width:min(800px,100%);max-height:min(640px,calc(100vh - 40px));display:grid;grid-template-rows:auto 1fr;background:#fff;border-radius:10px;border:1px solid var(--border);box-shadow:0 16px 40px rgba(10,14,24,.2);overflow:hidden}
.modal-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border)}
.modal-hd h3{font-size:15px;font-weight:700}
.modal-bd{overflow:auto;padding:16px}
.modal-sm{width:min(460px,100%)}
.cs{margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.cs:last-child{border-bottom:0}
.cs-t{font-size:13px;font-weight:700;color:var(--blue);margin-bottom:8px}
.cr{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start;padding:6px 0}
.cn{font-weight:600;font-size:12px;margin-bottom:2px}
.ch{color:var(--dim);font-size:11px;line-height:1.4}
.fld{width:100%;border:1px solid #c8ceda;border-radius:6px;padding:6px 8px;font-size:12px;background:#fff}
.fld:focus{outline:2px solid rgba(56,105,216,.15);border-color:var(--blue)}
textarea.fld{min-height:56px;resize:vertical}
.sw{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12px}
.sw input{width:14px;height:14px}
.sl{display:flex;align-items:center;gap:6px}
.sl input[type=range]{flex:1}
.sl .sv{font-weight:700;font-size:12px;min-width:32px;text-align:right}
.det-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.det-c{background:var(--bg);border-radius:8px;padding:10px}
.det-c .l{font-size:11px;color:var(--dim)}.det-c .v{font-size:18px;font-weight:800;margin-top:2px}
.emo{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.ei{background:var(--bg);border-radius:6px;padding:8px;text-align:center}
.ei .n{font-size:10px;color:var(--dim)}.ei .v{font-size:14px;font-weight:800}
.ei .eb{height:3px;background:#edf0f5;border-radius:2px;margin-top:3px;overflow:hidden}
.ei .ef{height:100%;border-radius:2px}
.bh{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.bc{background:var(--bg);border-radius:6px;padding:8px;text-align:center}
.bc .ic{font-size:16px}.bc .v{font-size:15px;font-weight:800}.bc .l{font-size:10px;color:var(--dim)}
.lb-r{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f0f2f5}
.lb-r:last-child{border-bottom:0}
.lb-rk{font-size:15px;min-width:24px;text-align:center}
.lb-i{flex:1;min-width:0}.lb-n{font-weight:700;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-s{font-size:10px;color:var(--dim)}.lb-sc{font-weight:800;font-size:13px}
.tst{min-height:16px;color:var(--dim);font-size:12px;margin-top:8px}
.tst.err{color:var(--red)}
.next-tag{display:inline-block;background:#e8f5e9;color:#2e7d32;border:1px solid #a5d6a7;border-radius:12px;padding:1px 8px;font-size:11px;font-weight:700;margin-left:8px}
.sec-t{font-size:13px;font-weight:700;margin:12px 0 8px;color:var(--text)}
.sec-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:10px}
.sec-box .item{font-size:12px;padding:3px 0;display:flex;align-items:center;gap:4px}
.sec-box .ic{flex-shrink:0}
.mem-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:10px;font-size:12px}
.mem-box .hd{font-weight:700;font-size:13px;margin-bottom:4px}
.advice{background:linear-gradient(135deg,#fff3e0,#fff8e1);border:1px solid #ffe0b2;border-radius:8px;padding:10px;margin-bottom:10px;font-size:12px}
.advice .hd{font-weight:700;font-size:13px;margin-bottom:4px;color:#e65100}
@media(max-width:800px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.det-grid{grid-template-columns:1fr}.cr{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="stats">
    <div class="stat c-pink"><div class="ic">💝</div><div class="v" id="xTotal">0</div><div class="l">情感档案</div></div>
    <div class="stat c-green"><div class="ic">✨</div><div class="v" id="xFav">0</div><div class="l">平均好感</div></div>
    <div class="stat c-blue"><div class="ic">🤝</div><div class="v" id="xInt">0</div><div class="l">平均亲密</div></div>
    <div class="stat c-purple"><div class="ic">🏆</div><div class="v" id="xStage">-</div><div class="l">最高阶段</div></div>
  </div>
  <div class="grid">
    <div class="card">
      <div class="card-hd"><h2>💝 情感档案</h2><button class="btn" id="bRefresh">刷新</button></div>
      <div class="card-bd"><div class="list" id="pList"></div></div>
    </div>
    <aside>
      <div class="card" style="margin-bottom:14px">
        <div class="card-hd"><h2>⚙️ 控制台</h2></div>
        <div class="card-bd">
          <div class="act">
            <button class="act-btn hot" id="bCfg">🎛️ 插件配置<div class="d">58 项参数可视化编辑</div></button>
            <button class="act-btn" id="bLB">🏆 好感排行榜</button>
            <button class="act-btn" id="bNeg">💀 负好感排行</button>
            <button class="act-btn" id="bFest">📅 节日与纪念日</button>
            <button class="act-btn" id="bRole">🎭 关系角色</button>
            <button class="act-btn" id="bAdm">🔧 管理员工具<div class="d">设置好感/亲密/重置</div></button>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-hd"><h2>📊 系统状态</h2></div>
        <div class="card-bd"><div class="sys" id="xSys">加载中...</div></div>
      </div>
    </aside>
  </div>
</div>

<div class="ov" id="oCfg"><div class="modal"><div class="modal-hd"><h3>🎛️ 插件配置</h3><div><button class="btn pri" id="cSave">保存</button> <button class="btn" id="cCan">取消</button></div></div><div class="modal-bd"><div id="cForm"></div><div class="tst" id="cTst"></div></div></div></div>
<div class="ov" id="oDet"><div class="modal"><div class="modal-hd"><h3 id="dTitle">💝 档案</h3><button class="btn" id="dCan">关闭</button></div><div class="modal-bd"><div id="dBody"></div></div></div></div>
<div class="ov" id="oLB"><div class="modal modal-sm"><div class="modal-hd"><h3 id="lTitle">🏆 排行榜</h3><button class="btn" id="lCan">关闭</button></div><div class="modal-bd"><div id="lBody"></div></div></div></div>
<div class="ov" id="oFest"><div class="modal modal-sm"><div class="modal-hd"><h3>📅 节日与纪念日</h3><button class="btn" id="fCan">关闭</button></div><div class="modal-bd"><div id="fBody"></div></div></div></div>
<div class="ov" id="oRole"><div class="modal"><div class="modal-hd"><h3>🎭 关系角色</h3><button class="btn" id="rCan">关闭</button></div><div class="modal-bd"><div id="rBody"></div><div class="tst" id="rTst"></div></div></div></div>
<div class="ov" id="oAdm"><div class="modal modal-sm"><div class="modal-hd"><h3>🔧 管理员</h3><button class="btn" id="aCan">关闭</button></div><div class="modal-bd">
  <div class="cs"><div class="cs-t">📝 设置好感度</div><div class="cr"><div><div class="cn">用户 ID</div></div><div><input class="fld" id="aFId"></div></div><div class="cr"><div><div class="cn">好感 (-100~100)</div></div><div><input class="fld" type="number" id="aFV"></div></div><button class="btn pri" id="aFB" style="margin-top:6px">设置</button></div>
  <div class="cs"><div class="cs-t">💕 设置亲密度</div><div class="cr"><div><div class="cn">用户 ID</div></div><div><input class="fld" id="aIId"></div></div><div class="cr"><div><div class="cn">亲密 (0~100)</div></div><div><input class="fld" type="number" id="aIV"></div></div><button class="btn pri" id="aIB" style="margin-top:6px">设置</button></div>
  <div class="cs"><div class="cs-t">🔄 重置用户</div><div class="cr"><div><div class="cn">用户 ID</div></div><div><input class="fld" id="aRId"></div></div><button class="btn dan" id="aRB" style="margin-top:6px">⚠️ 重置</button></div>
  <div class="tst" id="aTst"></div>
</div></div></div>

<script type="module">
const B = window.AstrBotPluginPage;
await B.ready();

const S=['🌱 初识期','🌿 好感期','🤝 信任期','💛 深化期','🌳 承诺期','🌸 共生期'];
const N=['😐 冷淡','😠 反感','💢 厌恶','🔥 敌对'];
const DM={joy:'喜悦',sadness:'悲伤',anger:'愤怒',fear:'恐惧',surprise:'惊讶',disgust:'厌恶',trust:'信任',anticipation:'期待'};
const DC={joy:'#fdcb6e',sadness:'#74b9ff',anger:'#e17055',fear:'#a29bfe',surprise:'#ffeaa7',disgust:'#55efc4',trust:'#00b894',anticipation:'#6c5ce7'};

let P=[],Bp=[],schema={},draft={},Fest=[],Roles=[];

const $=id=>document.getElementById(id);
const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};
const fc=v=>v>20?'var(--green)':v>0?'var(--blue)':v>-20?'var(--orange)':'var(--red)';
const pc=(v,a,b)=>Math.round(Math.max(0,Math.min(1,(v-a)/(b-a)))*100);
const stg=p=>{if(p.favorability<0){if(p.favorability>=-15)return N[0];if(p.favorability>=-40)return N[1];if(p.favorability>=-70)return N[2];return N[3]}return S[Math.max(0,Math.min(p.stage_index||0,5))]};
const tst=(id,m,e)=>{const el=$(id);if(el){el.textContent=m||'';el.classList.toggle('error',!!e)}};

async function load(){
  try{
    const r=await B.apiGet('data');
    P=r.profiles||[];Bp=r.behavior_profiles||[];Fest=r.festivals||[];Roles=r.relationship_roles||[];
    summary();list();status();
  }catch(e){$('pList').innerHTML=`<div class="empty"><div class="ic">⚠️</div>${esc(e.message||String(e))}</div>`}
}

function summary(){
  $('xTotal').textContent=P.length;
  if(P.length){
    $('xFav').textContent=(P.reduce((s,p)=>s+p.favorability,0)/P.length).toFixed(1);
    $('xInt').textContent=(P.reduce((s,p)=>s+p.intimacy,0)/P.length).toFixed(1);
    $('xStage').textContent=S[Math.max(...P.map(p=>p.stage_index||0))]??"-";
  }else{$('xFav').textContent=$('xInt').textContent='0';$('xStage').textContent='-'};
}

function list(){
  const c=$('pList');
  if(!P.length){c.innerHTML='<div class="empty"><div class="ic">💬</div>暂无档案<br><span style="font-size:12px">用户发消息后自动创建</span></div>';return}
  const sorted=[...P].sort((a,b)=>b.favorability-a.favorability);
  c.innerHTML='';
  for(const p of sorted){
    const bp=Bp.find(b=>b.user_id===p.user_id);
    const co=fc(p.favorability),sg=stg(p);
    const sk=bp&&bp.current_streak_count>1?` · ${bp.current_streak_type==='positive'?'✨':'⚡'}×${bp.current_streak_count}`:'';
    const r=document.createElement('div');r.className='row';
    r.onclick=()=>detail(p.user_id);
    r.innerHTML=`<div class="row-info"><div class="row-name">${esc(p.user_name||p.user_id)}</div><div class="row-id">${esc(p.user_id)}</div><div class="row-stage">${sg}${sk}</div><div class="bar"><div class="bar-fg" style="width:${pc(p.favorability,-100,100)}%;background:${co}"></div></div></div><div class="row-r"><div class="v" style="color:${co}">${p.favorability>=0?'+':''}${p.favorability.toFixed(1)}</div><div class="l">好感</div></div><div class="row-r"><div class="v">${p.intimacy.toFixed(0)}</div><div class="l">亲密</div></div>`;
    c.append(r);
  }
}

function status(){
  const sk=Bp.filter(b=>b.current_streak_count>=3);
  const bt=Bp.reduce((s,b)=>s+(b.betrayal_count||0),0);
  const cb=Bp.reduce((s,b)=>s+(b.comeback_count||0),0);
  $('xSys').innerHTML=`<div>📊 档案 <strong>${P.length}</strong></div><div>🎯 行为档案 <strong>${Bp.length}</strong></div><div>📅 节日 <strong>${Fest.length}</strong> · 🎭 关系角色 <strong>${Roles.length}</strong></div><div>🔥 活跃势头 <strong>${sk.length}</strong></div><div>💔 背叛 <strong>${bt}</strong> · 💫 回归 <strong>${cb}</strong></div><div style="margin-top:4px;font-size:11px;color:#aaa">心旅知音 SoulSync v2.8 · 六阶段 · 纪念日 · 统计 · 关系角色 · 感知 · 图片</div>`;
}

function detail(uid){
  const p=P.find(x=>x.user_id===uid);if(!p)return;
  $('oDet').dataset.uid=uid;
  const bp=Bp.find(b=>b.user_id===uid);
  $('dTitle').textContent=`🖼️ ${p.user_name||p.user_id} 的情感自画像`;
  const fav=p.favorability;

  // ── 核心数值 ──
  let h='<div class="det-grid">';
  h+=dc('好感度',`${fav>=0?'+':''}${fav.toFixed(1)}`,fav,-100,100,fc(fav));
  h+=dc('亲密度',p.intimacy.toFixed(1),p.intimacy,0,100,'var(--purple)');
  h+=dc('复合评分',p.composite_score.toFixed(1),null,0,0,'var(--blue)');
  h+=dc('阶段进度',`${p.stage_progress.toFixed(1)}%`,p.stage_progress,0,100,'var(--green)');
  h+='</div>';

  // ── 关系阶段 + 距下一阶段 ──
  h+=`<div style="margin-bottom:12px;font-size:13px">🧬 当前关系：${stg(p)}`;
  if(p.stage_index>=0&&p.stage_index<5){
    const thresholds=[15,32,50,68,82,95];
    const nxt=thresholds[p.stage_index+1];
    const need=nxt-p.composite_score;
    if(need>0)h+=`<span class="next-tag">还需 ${need.toFixed(1)} 分进阶</span>`;
  }else if(p.stage_index>=5){
    h+=`<span class="next-tag">🌸 最高阶段</span>`;
  }
  h+='</div>';
  // 关系角色（完整解锁状态 + 当前激活）
  if(p.relationships&&p.relationships.length){
    const relRows=p.relationships.filter(r=>r.key!=='stranger');
    h+=`<div class="sec-t">🎭 关系角色解锁</div><div class="sec-box">`;
    const activeRel=p.rel_active?p.relationships.find(x=>x.key===p.rel_active):null;
    const rk=p.rel_active?Roles.find(x=>x.key===p.rel_active):null;
    if(rk&&activeRel){
      const lockTag=p.rel_locked?'（🔒 已锁定）':'';
      h+=`<div class="item" style="font-weight:700"><span class="ic">⭐</span>当前关系：${rk.emoji} ${esc(rk.name)}${lockTag}</div>`;
    }
    for(const rr of relRows){
      const mark=rr.active?'✅':rr.unlocked?'🔓':rr.can_unlock?'🔑':'🔒';
      const state=rr.active?'使用中':rr.unlocked?'已解锁':rr.can_unlock?'可解锁':'未解锁';
      h+=`<div class="item"><span class="ic">${mark}</span>${esc(rr.name)}<span style="color:var(--dim);font-size:11px">（${state}）</span></div>`;
    }
    h+='</div>';
  }

  // ── 态度/关系描述 ──
  if(p.attitude_text||p.relationship_text){
    h+='<div class="sec-box">';
    if(p.attitude_text)h+=`<div class="item"><span class="ic">💭</span>AI 态度：${esc(p.attitude_text)}</div>`;
    if(p.relationship_text)h+=`<div class="item"><span class="ic">🤝</span>关系描述：${esc(p.relationship_text)}</div>`;
    h+='</div>';
  }

  // ── 8 维情感 ──
  h+='<div class="sec-t">🎭 情感画像</div><div class="emo">';
  const dimIc={joy:'😊',sadness:'😢',anger:'😠',fear:'😨',surprise:'😲',disgust:'🤢',trust:'🤗',anticipation:'✨'};
  for(const d of Object.keys(DM)){const v=(p.emotions&&p.emotions[d])||50;h+=`<div class="ei"><div class="n">${dimIc[d]||''} ${DM[d]}</div><div class="v" style="color:${DC[d]}">${v.toFixed(0)}</div><div class="eb"><div class="ef" style="width:${v}%;background:${DC[d]}"></div></div></div>`}
  h+='</div>';

  // ── 互动统计 ──
  h+='<div class="sec-box">';
  const pctPos=p.total_interactions>0?Math.round(p.positive_interactions/p.total_interactions*100):0;
  h+=`<div class="item"><span class="ic">💬</span>总互动 <strong>${p.total_interactions}</strong> 次 · 正面 <strong>${p.positive_interactions}</strong>（${pctPos}%） · 负面 <strong>${p.negative_interactions}</strong> · 对话 <strong>${p.conversation_turns}</strong> 轮</div>`;
  h+=`<div class="item"><span class="ic">🔄</span>距上次智能更新 <strong>${p.turns_since_update??0}</strong> 轮 · 最近更新 <strong>${p.last_update_ts?new Date(p.last_update_ts*1000).toLocaleString('zh-CN'):'未知'}</strong></div>`;

function refreshRoleStatus(){
  const rUser=$('rUser');
  if(!rUser)return;
  const uid=rUser.value;
  for(const p of P){
    if(p.user_id===uid){
      const rels=p.relationships||[];
      for(const rr of rels){
        const el=$('rs-'+rr.key);
        if(el){
          if(rr.active)el.textContent=rr.locked?'🔒 已锁定':'✅ 使用中';
          else el.textContent=rr.unlocked?'🔓 已解锁':(rr.can_unlock?'🔑 可解锁':'🔒 未解锁');
        }
      }
    }
  }
}

function refreshRoleSync(){

    const p=P.find(x=>x.user_id===rUser.value);
    if(p&&p.relationships){
      for(const rr of p.relationships){
        const el=$('rs-'+rr.key);
        if(el)el.textContent=rr.active?(rr.locked?'🔒 已锁定':'✅ 使用中'):(rr.unlocked?'🔓 已解锁':(rr.can_unlock?'🔑 可解锁':'🔒 未解锁'));

  }
  const oDet=$('oDet');
  if(oDet&&oDet.classList.contains('on')&&oDet.dataset.uid){
    const p=P.find(x=>x.user_id===oDet.dataset.uid);
    const dRole=$('dRole');
    if(dRole){
      if(p&&p.rel_active){
        const rk=Roles.find(x=>x.key===p.rel_active);
        const rel=p.relationships?p.relationships.find(x=>x.key===p.rel_active):null;

        dRole.innerHTML=rk?`🎭 关系角色：${rk.emoji} ${esc(rk.name)}${lockTag}`:'';
      }else if(dRole){dRole.innerHTML='';}
    }
  }
}

function ctrl(k,m){
  const w=document.createElement('div');
  if(m.type==='bool'){const l=document.createElement('label');l.className='sw';const i=document.createElement('input');i.type='checkbox';i.checked=Boolean(draft[k]??m.default);const s=document.createElement('span');s.textContent=i.checked?'启用':'关闭';i.onchange=()=>{draft[k]=i.checked;s.textContent=i.checked?'启用':'关闭'};l.append(i,s);w.append(l)}
  else if(m.options){const s=document.createElement('select');s.className='fld';(Array.isArray(m.options)?m.options:[]).forEach(o=>{const opt=document.createElement('option');opt.value=o;opt.textContent=o;s.append(opt)});s.value=draft[k]??m.default??'';s.onchange=()=>{draft[k]=m.type==='int'?Number(s.value):s.value};w.append(s)}
  else if(m.type==='text'){const t=document.createElement('textarea');t.className='fld';t.value=String(draft[k]??m.default??'').replace(/\\n/g,'\n');t.oninput=()=>{draft[k]=t.value};w.append(t)}
  else if(m.slider){const r=document.createElement('div');r.className='sl';const i=document.createElement('input');i.type='range';i.min=m.slider.min;i.max=m.slider.max;i.step=m.slider.step;i.value=draft[k]??m.default??0;const sv=document.createElement('span');sv.className='sv';sv.textContent=i.value;i.oninput=()=>{const v=m.type==='float'?parseFloat(i.value):parseInt(i.value,10);draft[k]=v;sv.textContent=v};r.append(i,sv);w.append(r)}
  else{const i=document.createElement('input');i.className='fld';i.type=m.type==='int'||m.type==='float'?'number':'text';if(m.type==='int')i.step='1';if(m.type==='float')i.step='0.01';i.value=draft[k]??m.default??'';i.oninput=()=>{draft[k]=m.type==='int'?parseInt(i.value||'0',10):m.type==='float'?parseFloat(i.value||'0'):i.value};w.append(i)}
  return w;
}
