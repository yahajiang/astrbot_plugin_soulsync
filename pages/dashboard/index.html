<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>心旅知音 SoulSync</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --text:#1c2433;--dim:#5b6577;
  --gold:#A67C2F;--gold-d:#8C6A1F;--gold-l:#C9A34E;
  --green:#0E9F6E;--blue:#3B66D8;--red:#C0392B;--orange:#D9822B;--purple:#7C5CE7;
  --glass-bg:rgba(255,255,255,.55);--glass-bg-strong:rgba(255,255,255,.78);
  --glass-border:rgba(255,255,255,.65);--glass-line:rgba(15,25,50,.08);
  --shadow-s:0 2px 8px rgba(15,25,50,.06),inset 0 1px 0 rgba(255,255,255,.85),inset 0 -1px 0 rgba(15,25,50,.05);
  --shadow-m:0 8px 24px rgba(15,25,50,.08),inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(15,25,50,.06);
  --shadow-l:0 16px 48px rgba(15,25,50,.12),0 0 0 1px rgba(255,255,255,.6),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(15,25,50,.08);
  --shadow-hover:0 20px 60px rgba(15,25,50,.14),0 0 0 1px rgba(255,255,255,.7),inset 0 1px 0 rgba(255,255,255,1);
  --spring:cubic-bezier(.16,1,.3,1);
}
body{position:relative;overflow-x:hidden;min-height:100vh;background:
  url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncA type='linear' slope='0.025'/></feComponentTransfer></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"),
  linear-gradient(135deg,#F4F6FB 0%,#FBF7F0 45%,#F1F5FA 100%);
  background-attachment:fixed,fixed;color:var(--text);font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body::before,body::after{content:"";position:fixed;border-radius:50%;pointer-events:none;z-index:0}
body::before{width:660px;height:660px;background:radial-gradient(circle at center,rgba(124,156,196,.2) 0%,rgba(124,156,196,.1) 50%,rgba(124,156,196,.03) 74%,rgba(124,156,196,0) 92%);top:-230px;left:-210px;animation:driftA 38s ease-in-out infinite alternate}
body::after{width:720px;height:720px;background:radial-gradient(circle at center,rgba(166,124,47,.16) 0%,rgba(166,124,47,.08) 50%,rgba(166,124,47,.02) 74%,rgba(166,124,47,0) 92%);bottom:-250px;right:-230px;animation:driftB 46s ease-in-out infinite alternate}
.wrap{max-width:1200px;margin:0 auto;padding:20px;position:relative;z-index:1}
.grid{display:grid;grid-template-columns:1fr 320px;gap:18px}
.card{position:relative;background:var(--glass-bg);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--glass-border);border-radius:24px;overflow:hidden;box-shadow:var(--shadow-m);background-image:linear-gradient(to bottom,rgba(255,255,255,.35),transparent 50%);transition:box-shadow .5s var(--spring);animation:riseIn .5s var(--spring) backwards}
.card:hover{box-shadow:var(--shadow-hover)}
.grid .card:first-child{animation-delay:.2s}
.grid aside .card{animation-delay:.28s}
.card-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--glass-line)}
.card-hd h2{font-size:16px;font-weight:700;color:var(--text)}
.card-bd{padding:16px 18px}
.btn{border:1px solid rgba(255,255,255,.6);border-radius:16px;background:rgba(255,255,255,.65);padding:6px 14px;cursor:pointer;font-size:13px;color:var(--text);box-shadow:var(--shadow-s);transition:all .5s var(--spring)}
.btn:hover{background:rgba(255,255,255,.85);border-color:rgba(255,255,255,.9);transform:translateY(-1px);box-shadow:var(--shadow-hover)}
.btn:active{transform:translateY(0) scale(.97)}
.btn.pri{background:var(--gold);color:#FFF8E8;border-color:var(--gold-l)}
.btn.pri:hover{background:var(--gold-d);color:#fff}
.btn.dan{background:var(--red);color:#fff;border-color:#D96C5A}
.btn.sm{padding:4px 10px;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{position:relative;background:var(--glass-bg);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--glass-border);border-radius:20px;padding:12px;text-align:center;overflow:hidden;box-shadow:var(--shadow-s);transition:all .5s var(--spring);animation:riseIn .5s var(--spring) backwards}
.stat:nth-child(2){animation-delay:.06s}
.stat:nth-child(3){animation-delay:.12s}
.stat:nth-child(4){animation-delay:.18s}
.stat:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}
.stat .ic{display:inline-block;transition:transform .5s var(--spring)}
.stat:hover .ic{transform:scale(1.12) rotate(-6deg)}
.stat .ic{font-size:20px}.stat .v{font-size:20px;font-weight:800;margin-top:4px}.stat .l{font-size:11px;color:var(--dim)}
.c-pink .v{color:var(--gold)}.c-green .v{color:var(--green)}.c-blue .v{color:var(--blue)}.c-purple .v{color:var(--purple)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;background:rgba(255,255,255,.5);border:1px solid var(--glass-line);border-radius:16px;cursor:pointer;transition:all .5s var(--spring)}
.row:hover{transform:translateY(-2px);background:rgba(255,255,255,.75);border-color:rgba(166,124,47,.4);box-shadow:var(--shadow-s)}
.row:active{transform:translateY(0)}
.row-info{flex:1;min-width:0}
.row-name{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-id{font-size:11px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-stage{font-size:11px;color:var(--dim);margin-top:2px}
.bar{height:4px;background:rgba(15,25,50,.07);border-radius:999px;overflow:hidden;margin-top:4px}
.bar-fg{height:100%;border-radius:999px;transition:width .5s var(--spring)}
.row-r{text-align:center;min-width:48px}
.row-r .v{font-size:14px;font-weight:800}.row-r .l{font-size:10px;color:var(--dim)}
.empty{text-align:center;padding:40px;color:var(--dim)}
.empty .ic{font-size:36px;margin-bottom:8px}
.act{display:flex;flex-direction:column;gap:8px}
.act-btn{width:100%;padding:10px 14px;border-radius:16px;border:1px solid var(--glass-line);background:rgba(255,255,255,.5);cursor:pointer;font-weight:600;font-size:13px;text-align:left;color:var(--text);transition:all .5s var(--spring)}
.act-btn:hover{background:rgba(255,255,255,.8);border-color:rgba(166,124,47,.4);color:var(--gold);transform:translateX(3px);box-shadow:var(--shadow-s)}
.act-btn:active{transform:translateX(0)}
.act-btn .d{font-size:11px;font-weight:400;color:var(--dim)}
.act-btn.hot{background:var(--gold);color:#FFF8E8;border-color:var(--gold-l);box-shadow:0 6px 20px rgba(166,124,47,.25)}
.act-btn.hot:hover{background:var(--gold-d);color:#fff;transform:translateX(3px);box-shadow:0 8px 28px rgba(166,124,47,.35)}
.sys{font-size:12px;color:var(--dim);line-height:1.8}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(15,25,50,.32);z-index:10;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .5s var(--spring),visibility 0s linear .5s}
.ov.on{opacity:1;visibility:visible;pointer-events:auto;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:opacity .5s var(--spring),visibility 0s linear 0s}
.modal{width:min(800px,100%);max-height:min(640px,calc(100vh - 40px));display:grid;grid-template-rows:auto 1fr;background:var(--glass-bg-strong);border-radius:24px;border:1px solid var(--glass-border);box-shadow:var(--shadow-l);overflow:hidden;transform:translateY(16px) scale(.96);opacity:0;transition:transform .5s var(--spring),opacity .5s var(--spring)}
.ov.on .modal{transform:translateY(0) scale(1);opacity:1;-webkit-backdrop-filter:blur(60px) saturate(180%);backdrop-filter:blur(60px) saturate(180%);will-change:transform,opacity}
.modal-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--glass-line);background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0))}
.modal-hd h3{font-size:15px;font-weight:700}
.modal-bd{overflow:auto;padding:16px}
.modal-sm{width:min(460px,100%)}
.cs{margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--glass-line)}
.cs:last-child{border-bottom:0}
.cs-t{font-size:13px;font-weight:700;color:var(--gold);margin-bottom:8px}
.cr{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start;padding:6px 0}
.cn{font-weight:600;font-size:12px;margin-bottom:2px}
.ch{color:var(--dim);font-size:11px;line-height:1.4}
.fld{width:100%;border:1px solid rgba(15,25,50,.14);border-radius:12px;padding:6px 8px;font-size:12px;background:rgba(255,255,255,.65);color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),inset 0 -1px 0 rgba(15,25,50,.05);transition:all .5s var(--spring)}
.fld::placeholder{color:rgba(28,36,51,.35)}
.fld:focus{outline:none;border-color:rgba(166,124,47,.5);background:rgba(255,255,255,.85);box-shadow:0 0 0 3px rgba(166,124,47,.18),inset 0 1px 0 rgba(255,255,255,.9)}
textarea.fld{min-height:56px;resize:vertical}
.sw{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12px}
.sw input{width:14px;height:14px}
.sl{display:flex;align-items:center;gap:6px}
.sl input[type=range]{flex:1}
.sl .sv{font-weight:700;font-size:12px;min-width:32px;text-align:right}
.det-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.det-c{background:rgba(255,255,255,.5);border:1px solid var(--glass-line);border-radius:14px;padding:10px}
.det-c .l{font-size:11px;color:var(--dim)}.det-c .v{font-size:18px;font-weight:800;margin-top:2px}
.emo{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.ei{background:rgba(255,255,255,.5);border:1px solid var(--glass-line);border-radius:12px;padding:8px;text-align:center}
.ei .n{font-size:10px;color:var(--dim)}.ei .v{font-size:14px;font-weight:800}
.ei .eb{height:3px;background:rgba(15,25,50,.07);border-radius:999px;margin-top:3px;overflow:hidden}
.ei .ef{height:100%;border-radius:999px;transition:width .5s var(--spring)}
.bh{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.bc{background:rgba(255,255,255,.5);border:1px solid var(--glass-line);border-radius:12px;padding:8px;text-align:center}
.bc .ic{font-size:16px}.bc .v{font-size:15px;font-weight:800}.bc .l{font-size:10px;color:var(--dim)}
.lb-r{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(15,25,50,.06)}
.lb-r:last-child{border-bottom:0}
.lb-rk{font-size:15px;min-width:24px;text-align:center}
.lb-i{flex:1;min-width:0}.lb-n{font-weight:700;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-s{font-size:10px;color:var(--dim)}.lb-sc{font-weight:800;font-size:13px}
.tst{min-height:16px;color:var(--dim);font-size:12px;margin-top:8px}
.tst.err{color:var(--red)}
.next-tag{display:inline-block;background:#E8F3EC;color:#1E7A4E;border:1px solid #A8D4BC;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700;margin-left:8px}
.sec-t{font-size:13px;font-weight:700;margin:12px 0 8px;color:var(--text)}
.sec-box{background:rgba(255,255,255,.5);border:1px solid var(--glass-line);border-radius:14px;padding:8px 10px;margin-bottom:10px}
.sec-box .item{font-size:12px;padding:3px 0;display:flex;align-items:center;gap:4px}
.sec-box .ic{flex-shrink:0}
.mem-box{background:rgba(255,255,255,.5);border:1px solid var(--glass-line);border-radius:14px;padding:10px;margin-bottom:10px;font-size:12px}
.mem-box .hd{font-weight:700;font-size:13px;margin-bottom:4px}
.advice{background:linear-gradient(135deg,rgba(255,246,224,.9),rgba(255,250,235,.9));border:1px solid rgba(201,163,78,.45);border-radius:16px;padding:10px;margin-bottom:10px;font-size:12px}
.advice .hd{font-weight:700;font-size:13px;margin-bottom:4px;color:var(--gold-d)}
*{scrollbar-width:none}
::-webkit-scrollbar{width:0;height:0}
.mm-sc{position:absolute;top:2px;right:2px;bottom:2px;width:10px;z-index:9;opacity:0;pointer-events:none;transition:opacity .15s ease-out}
.mm-sc.mm-fixed{position:fixed}
.mm-sc.vis{opacity:1;pointer-events:auto}
.mm-thumb{position:absolute;top:0;right:0;width:4px;min-height:40px;border-radius:999px;background:rgba(15,25,50,.16);box-shadow:none;animation:mmY linear;animation-timeline:scroll();animation-range:0 100%;transition:width .2s ease-out,background .2s ease-out,box-shadow .2s ease-out}
.mm-sc.hov .mm-thumb{width:8px;background:rgba(166,124,47,.45);box-shadow:0 0 2px rgba(15,25,50,.08)}
.mm-sc.drag .mm-thumb{width:8px;background:rgba(166,124,47,.65);box-shadow:0 0 2px rgba(15,25,50,.08)}
.mm-has-sc{position:relative}
@media(pointer:coarse){.mm-sc{display:none}}
@media(prefers-reduced-motion:reduce){.mm-sc,.mm-thumb{transition:none}}
@keyframes riseIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes driftA{from{transform:translate(0,0)}to{transform:translate(48px,40px)}}
@keyframes driftB{from{transform:translate(0,0)}to{transform:translate(-42px,-36px)}}
@keyframes mmY{from{transform:translateY(0)}to{transform:translateY(var(--mm-y))}}
@supports not ((backdrop-filter:blur(4px)) or (-webkit-backdrop-filter:blur(4px))){.card,.stat,.modal,.row:hover{background:rgba(255,255,255,.92)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.row:hover,.btn:hover,.act-btn:hover,.stat:hover{transform:none!important}.stat:hover .ic{transform:none!important}}
@media(max-width:800px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.det-grid{grid-template-columns:1fr}.cr{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="stats">
    <div class="stat c-pink"><div class="ic">💝</div><div class="v" id="xTotal">0</div><div class="l">情感档案</div></div>
    <div class="stat c-green"><div class="ic">✨</div><div class="v" id="xFav">0</div><div class="l">平均好感</div></div>
    <div class="stat c-blue"><div class="ic">🤝</div><div class="v" id="xInt">0</div><div class="l">平均亲密</div></div>
    <div class="stat c-purple"><div class="ic">🏆</div><div class="v" id="xStage">-</div><div class="l">最高阶段</div></div>
  </div>
  <div class="grid">
    <div class="card">
      <div class="card-hd"><h2>💝 情感档案</h2><button class="btn" id="bRefresh">刷新</button></div>
      <div class="card-bd"><div class="list" id="pList"></div></div>
    </div>
    <aside>
      <div class="card" style="margin-bottom:14px">
        <div class="card-hd"><h2>⚙️ 控制台</h2></div>
        <div class="card-bd">
          <div class="act">
            <button class="act-btn hot" id="bCfg">🎛️ 插件配置<div class="d">57 项参数可视化编辑</div></button>
            <button class="act-btn" id="bLB">🏆 好感排行榜</button>
            <button class="act-btn" id="bNeg">💀 负好感排行</button>
            <button class="act-btn" id="bFest">📅 节日与纪念日</button>
            <button class="act-btn" id="bRole">🎭 关系角色</button>
            <button class="act-btn" id="bAdm">🔧 管理员工具<div class="d">设置好感/亲密/重置</div></button>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-hd"><h2>📊 系统状态</h2></div>
        <div class="card-bd"><div class="sys" id="xSys">加载中...</div></div>
      </div>
    </aside>
  </div>
</div>

<div class="ov" id="oCfg"><div class="modal"><div class="modal-hd"><h3>🎛️ 插件配置</h3><div><button class="btn pri" id="cSave">保存</button> <button class="btn" id="cCan">取消</button></div></div><div class="modal-bd"><div id="cForm"></div><div class="tst" id="cTst"></div></div></div></div>
<div class="ov" id="oDet"><div class="modal"><div class="modal-hd"><h3 id="dTitle">💝 档案</h3><button class="btn" id="dCan">关闭</button></div><div class="modal-bd"><div id="dBody"></div></div></div></div>
<div class="ov" id="oLB"><div class="modal modal-sm"><div class="modal-hd"><h3 id="lTitle">🏆 排行榜</h3><button class="btn" id="lCan">关闭</button></div><div class="modal-bd"><div id="lBody"></div></div></div></div>
<div class="ov" id="oFest"><div class="modal modal-sm"><div class="modal-hd"><h3>📅 节日与纪念日</h3><button class="btn" id="fCan">关闭</button></div><div class="modal-bd"><div id="fBody"></div></div></div></div>
<div class="ov" id="oRole"><div class="modal"><div class="modal-hd"><h3>🎭 关系角色</h3><button class="btn" id="rCan">关闭</button></div><div class="modal-bd"><div id="rBody"></div><div class="tst" id="rTst"></div></div></div></div>
<div class="ov" id="oAdm"><div class="modal modal-sm"><div class="modal-hd"><h3>🔧 管理员</h3><button class="btn" id="aCan">关闭</button></div><div class="modal-bd">
  <div class="cs"><div class="cs-t">👤 选择用户</div><div class="cr"><div><div class="cn">档案用户</div></div><div><select class="fld" id="aUser"><option value="">— 选择或手动输入下方 ID —</option></select></div></div><div style="font-size:11px;color:var(--dim);margin-top:2px" id="aPrev"></div></div>
  <div class="cs"><div class="cs-t">📝 设置好感度</div><div class="cr"><div><div class="cn">用户 ID</div></div><div><input class="fld" id="aFId"></div></div><div class="cr"><div><div class="cn">好感 (-100~200)</div></div><div><input class="fld" type="number" id="aFV"></div></div><button class="btn pri" id="aFB" style="margin-top:6px">设置</button></div>
  <div class="cs"><div class="cs-t">🎚️ 快捷调整</div><div class="cr"><div><div class="cn">当前好感</div></div><div style="font-weight:800" id="aCur">—</div></div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"><button class="btn sm" data-d="50">+50</button><button class="btn sm" data-d="10">+10</button><button class="btn sm" data-d="5">+5</button><button class="btn sm" data-d="-5">-5</button><button class="btn sm" data-d="-10">-10</button><button class="btn sm" data-d="-50">-50</button></div><div style="font-size:11px;color:var(--dim);margin-top:4px">基于当前好感即时增减（-100 ~ 200 自动钳制）</div></div>
  <div class="cs"><div class="cs-t">🧹 清空长期记忆</div><div class="cr"><div><div class="cn">用户 ID</div></div><div><input class="fld" id="aMId"></div></div><button class="btn" id="aMB" style="margin-top:6px">🧹 清空记忆</button><div style="font-size:11px;color:var(--dim);margin-top:4px">仅清除长期记忆，保留好感/阶段等档案数据</div></div>
  <div class="cs"><div class="cs-t">🔄 重置用户</div><div class="cr"><div><div class="cn">用户 ID</div></div><div><input class="fld" id="aRId"></div></div><button class="btn dan" id="aRB" style="margin-top:6px">⚠️ 重置</button><div style="font-size:11px;color:var(--dim);margin-top:4px">删除该用户全部档案（好感/记忆/行为），不可恢复</div></div>
  <div class="tst" id="aTst"></div>
</div></div></div>

<script type="module">
const B = window.AstrBotPluginPage;
await B.ready();

const S=['🌱 初识期','🌿 好感期','🤝 信任期','🍀 熟悉期','💬 交心期','💛 深化期','🧡 心动期','💜 默契期','💖 依恋期','💞 缠绵期','🌳 承诺期','🌸 共生期'];
const N=['😐 冷淡','😠 反感','💢 厌恶','🔥 敌对'];
const DM={joy:'喜悦',sadness:'悲伤',anger:'愤怒',fear:'恐惧',surprise:'惊讶',disgust:'厌恶',trust:'信任',anticipation:'期待'};
const DI={joy:'😊',sadness:'😢',anger:'😠',fear:'😨',surprise:'😲',disgust:'🤢',trust:'🤗',anticipation:'✨'};
function anchorOf(em){
  if(!em||typeof em!=='object')return '';
  return Object.entries(em).sort((a,b)=>b[1]-a[1]).slice(0,2)
    .map(([d,v])=>`${DI[d]||'•'}${DM[d]||d}${Math.round(v)}`).join(' · ');
}
const CM={'感动':{'joy':60,'trust':60},'失望':{'sadness':55,'disgust':50},'醋意':{'anger':50,'fear':50},'忐忑':{'anticipation':50,'fear':50},'依恋':{'trust':60,'anticipation':50}};
function compoundOf(em){
  if(!em||typeof em!=='object')return [];
  return Object.keys(CM).filter(l=>Object.entries(CM[l]).every(([d,t])=>(em[d]||0)>=t));
}
const DC={joy:'#fdcb6e',sadness:'#74b9ff',anger:'#e17055',fear:'#a29bfe',surprise:'#ffeaa7',disgust:'#55efc4',trust:'#00b894',anticipation:'#6c5ce7'};

let P=[],Bp=[],schema={},draft={},Fest=[],Roles=[];

const $=id=>document.getElementById(id);
const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};
const fc=v=>v>40?'var(--green)':v>0?'var(--blue)':v>-20?'var(--orange)':'var(--red)';
const pc=(v,a,b)=>Math.round(Math.max(0,Math.min(1,(v-a)/(b-a)))*100);
const stg=p=>{if(p.favorability<0){if(p.favorability>=-15)return N[0];if(p.favorability>=-40)return N[1];if(p.favorability>=-70)return N[2];return N[3]}return S[Math.max(0,Math.min(p.stage_index||0,11))]};
const tst=(id,m,e)=>{const el=$(id);if(el){el.textContent=m||'';el.classList.toggle('error',!!e)}};

function drawRadar(cv,r){
  if(!cv||!r)return;
  const ctx=cv.getContext('2d'),w=cv.width,h=cv.height,cx=w/2,cy=h/2+6,R=Math.min(w,h)/2-36,n=r.labels.length;
  ctx.clearRect(0,0,w,h);
  const ang=i=>-Math.PI/2+i*2*Math.PI/n;
  for(let ring=1;ring<=4;ring++){
    ctx.beginPath();
    for(let i=0;i<=n;i++){const a=ang(i%n),x=cx+Math.cos(a)*R*ring/4,y=cy+Math.sin(a)*R*ring/4;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
    ctx.strokeStyle='#e3e8f0';ctx.stroke();
  }
  for(let i=0;i<n;i++){
    const a=ang(i),x=cx+Math.cos(a)*R,y=cy+Math.sin(a)*R;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(x,y);ctx.strokeStyle='#e3e8f0';ctx.stroke();
    const lx=cx+Math.cos(a)*(R+18),ly=cy+Math.sin(a)*(R+18);
    ctx.fillStyle='#5a6478';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(r.labels[i],lx,ly);
  }
  const poly=(vals,color)=>{
    ctx.beginPath();
    for(let i=0;i<n;i++){
      const v=Math.max(0,Math.min(100,vals[i]||0))/100,a=ang(i),x=cx+Math.cos(a)*R*v,y=cy+Math.sin(a)*R*v;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.closePath();ctx.fillStyle=color;ctx.strokeStyle=color;ctx.stroke();
  };
  poly(r.before,'rgba(140,163,200,0.32)');
  poly(r.after,'rgba(212,175,55,0.42)');
}

function list(){

function refreshRoleStatus(){
  const rUser=$('rUser');
  if(!rUser)return;
  const uid=rUser.value;
  for(const p of P){
    if(p.user_id===uid){
      const rels=p.relationships||[];
      for(const rr of rels){
        const el=$('rs-'+rr.key);
        if(el){
          if(rr.active)el.textContent=rr.locked?'🔒 已锁定':'✅ 使用中';
          else el.textContent=rr.unlocked?'🔓 已解锁':(rr.can_unlock?'🔑 可解锁':'🔒 未解锁');

      }
    }
  }
}

,'trend_default_days'],'🎭 关系角色':['enable_relationship_roles','relationship_auto_assign'],'🖼️ 图片输出':['enable_image_output','image_output_default','image_output_global']};

function ctrl(k,m){
  const w=document.createElement('div');
  if(m.type==='bool'){const l=document.createElement('label');l.className='sw';const i=document.createElement('input');i.type='checkbox';i.checked=Boolean(draft[k]??m.default);const s=document.createElement('span');s.textContent=i.checked?'启用':'关闭';i.onchange=()=>{draft[k]=i.checked;s.textContent=i.checked?'启用':'关闭'};l.append(i,s);w.append(l)}
  else if(m.options){const s=document.createElement('select');s.className='fld';(Array.isArray(m.options)?m.options:[]).forEach(o=>{const opt=document.createElement('option');opt.value=o;opt.textContent=o;s.append(opt)});s.value=draft[k]??m.default??'';s.onchange=()=>{draft[k]=m.type==='int'?Number(s.value):s.value};w.append(s)}
  else if(m.type==='text'){const t=document.createElement('textarea');t.className='fld';t.value=String(draft[k]??m.default??'').replace(/\\n/g,'\n');t.oninput=()=>{draft[k]=t.value};w.append(t)}
  else if(m.slider){const r=document.createElement('div');r.className='sl';const i=document.createElement('input');i.type='range';i.min=m.slider.min;i.max=m.slider.max;i.step=m.slider.step;i.value=draft[k]??m.default??0;const sv=document.createElement('span');sv.className='sv';sv.textContent=i.value;i.oninput=()=>{const v=m.type==='float'?parseFloat(i.value):parseInt(i.value,10);draft[k]=v;sv.textContent=v};r.append(i,sv);w.append(r)}
  else{const i=document.createElement('input');i.className='fld';i.type=m.type==='int'||m.type==='float'?'number':'text';if(m.type==='int')i.step='1';if(m.type==='float')i.step='0.01';i.value=draft[k]??m.default??'';i.oninput=()=>{draft[k]=m.type==='int'?parseInt(i.value||'0',10):m.type==='float'?parseFloat(i.value||'0'):i.value};w.append(i)}
  return w;
}

// ── Minimal Modern 滚动条滑块：原生滚动 + 自定义滑块（静止0.4/悬停0.7/拖动1.0 透明度、150ms淡入、200ms宽度渐变、停止1s淡出）──
function mmScroll(el,fixed){
  const sc=document.createElement('div');sc.className='mm-sc'+(fixed?' mm-fixed':'');
  const th=document.createElement('div');th.className='mm-thumb';sc.appendChild(th);
  (fixed?document.body:el).appendChild(sc);
  if(!fixed)el.classList.add('mm-has-sc');
  const CSS_TL=CSS.supports&&CSS.supports('animation-timeline','scroll()');
  if(!CSS_TL)th.style.animation='none';
  const dim=()=>fixed?{c:innerHeight,s:document.documentElement.scrollHeight,t:scrollY}:{c:el.clientHeight,s:el.scrollHeight,t:el.scrollTop};
  const up=()=>{
    const d=dim();
    if(d.s<=d.c+1){sc.classList.remove('vis');th.style.height='0';return}
    const h=Math.max(40,d.c*d.c/d.s);
    th.style.height=h+'px';
    const y=(d.t/(d.s-d.c))*(d.c-h);
    if(CSS_TL)th.style.setProperty('--mm-y',y+'px');
    else th.style.transform='translateY('+y+'px)';
  };
  let raf=0;
  const onScroll=()=>{if(!CSS_TL&&!raf)raf=requestAnimationFrame(()=>{raf=0;up()});show()};
  const show=()=>{sc.classList.add('vis');clearTimeout(sc._t);sc._t=setTimeout(()=>{if(!sc.classList.contains('drag')&&!sc._ov)sc.classList.remove('vis')},1000)};
  (fixed?addEventListener('scroll',onScroll,{passive:true}):el.addEventListener('scroll',onScroll,{passive:true}));
  addEventListener('resize',()=>{if(!raf){raf=requestAnimationFrame(()=>{raf=0;up()})}});
  if('ResizeObserver' in window)new ResizeObserver(up).observe(fixed?document.body:el);
  sc.addEventListener('mouseenter',()=>{sc._ov=true;sc.classList.add('hov');clearTimeout(sc._t);show()});
  sc.addEventListener('mouseleave',()=>{sc._ov=false;sc.classList.remove('hov');clearTimeout(sc._t);sc._t=setTimeout(()=>{if(!sc.classList.contains('drag'))sc.classList.remove('vis')},1000)});
  th.addEventListener('mousedown',e=>{
    if(e.button)return;e.preventDefault();
    sc.classList.add('drag');
    const d0=dim(),dy=e.clientY-th.getBoundingClientRect().top,ds=d0.t;
    const mv=ev=>{
      const d=dim(),hh=Math.max(40,d.c*d.c/d.s);
      const nv=ds+((ev.clientY-dy)/(d.c-hh))*(d.s-d.c);
      if(fixed)scrollTo(0,nv);else el.scrollTop=nv;
    };
    const mu=()=>{sc.classList.remove('drag');removeEventListener('mousemove',mv);removeEventListener('mouseup',mu);show()};
    addEventListener('mousemove',mv);addEventListener('mouseup',mu);
  });
  up();
}
