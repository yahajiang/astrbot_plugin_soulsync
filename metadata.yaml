name: astrbot_plugin_soulsync_bistro
display_name: 心旅小馆
desc: 根据 SoulSync 检测到的聊天情绪（喜悦/悲伤/愤怒/焦虑/期待）与当前时间（早餐/午餐/下午茶/晚餐/夜宵）推荐本地 4000 道菜谱（套餐/饮品/解馋）。自动截取 LLM 回复分析情绪并缓存快照，支持 /吃点啥、/喝点啥、/解馋、/菜谱搜索、/怎么做、/随机推荐、/好吃、/不好吃、/我的口味、/口味设置、/口味查看、/口味重置、/今天、/家里有、/心馆 状态，群聊无前缀「吃什么」直接触发。推荐含 3 天去重、个人反馈加权（反馈闭环）、口味档案（忌口硬排除/偏好加权）、时间感知（节日菜/季节加权/时段提示）与食材反查（按手头食材推荐可做菜），全部数据本地存储，运行时零网络。
version: v1.10.0
author: Yahajiang
repo: https://github.com/yahajiang/astrbot_plugin_soulsync/tree/soulsync-bistro
