name: astrbot_plugin_soulsync
display_name: "心旅知音 (SoulSync) - 融合版情感智能插件"
desc: "心旅知音（SoulSync）：融合 EmotionAI 与 FavourPro 精华的情感智能插件。8 维情感模型、十二阶段关系演进（RDE，含危机系统与多角色关系网）、复合评分（综合契合度 0~100 归一化展示）、长期记忆与私人记忆库、知识库与人格微调、语言风格训练、纪念日/节日系统、时间感知（天气×节气×月相→心情映射、倒计时叙事、时间跳跃）、自然语言意图识别、图片卡片输出与 WebUI 控制台。v3.11 指令精简：普通用户命令 40→18，管理员命令 15+→8，功能迁移至 WebUI。"
version: "3.11"
author: "Yahajiang"
