name: astrbot_plugin_soulsync
display_name: "心旅知音 (SoulSync) - 融合版情感智能插件"
desc: "心旅知音（SoulSync）：融合 EmotionAI 与 FavourPro 精华的情感智能插件，支持 8 维情感模型、十二阶段关系演进、智能更新、辅助 LLM、长期记忆、负好感支持、过渡保护、惩罚奖励机制（冷落惩罚每日定时结算，启动补结算 + 每日 00:10）、好感正向增长放缓（v2.13 fav_growth_rate 50%）、情感自画像、纪念日/节日系统、数据趋势统计、关系角色（含自定义态度/关系合并）、时间感知深化（天气×节气×月相→心情映射 + 倒计时六阶段叙事 + 时间跳跃告别/回归）、图片输出、WebUI 控制台。好感度上限 200，亲密度按好感度百分比派生。v2.17 新增个性化训练模块：人格微调（20参数隐式训练+稳定化）、知识库（6类知识情景捕捉）、语言风格（三阶段训练+快照管理）、私人记忆（5种记忆类型+检索审计）。v2.19 新增时间感知深化系统（TPD）：三级降级天气获取 + 8维心情映射 + 倒计时事件六阶段叙事 + 时间跳跃叙事（告别/回归/被动离开）+ 冷落惩罚冻结 + 6 命令 + WebUI 面板。v2.20 轻量化重构：70 命令收敛为 10 父命令 + /admin、EventBus 事件总线解耦、人格护栏（自动锁定/剧变回滚/极端解锁/管理员2h临时锁定）、自然语言意图识别静默命令、前后置钩子机制。v2.21 RDE 关系深度演进：十二阶段叙事按间隔注入（默认每 3 轮，阶段跃迁强制）+ 关系危机系统（7 类事件/概率触发/选择处理）+ 多角色关系网（跨角色好感传导/社交事件）；配置面板 16 个模块组全量可视化编辑。"
version: "2.21"
author: "Yahajiang"
repo: "https://github.com/yahajiang/astrbot_plugin_soulsync"
pages:
  - name: dashboard
    title: 心旅知音 (SoulSync) 情感控制台
