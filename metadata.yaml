name: astrbot_plugin_soulsync
display_name: "心旅知音 (SoulSync) v2.19 - 融合版情感智能插件（时间感知深化）"
desc: "心旅知音（SoulSync）：融合 EmotionAI 与 FavourPro 精华的情感智能插件，支持 8 维情感模型、十二阶段关系演进、智能更新、辅助 LLM、长期记忆、负好感支持、过渡保护、惩罚奖励机制（冷落惩罚每日定时结算，启动补结算 + 每日 00:10）、好感正向增长放缓（v2.13 fav_growth_rate 50%）、情感自画像、纪念日/节日系统、数据趋势统计、关系角色（含自定义态度/关系合并）、时间感知、图片输出、WebUI 控制台（浅色日景玻璃拟态 + Minimal Modern 滚动条滑块 + 管理员工具 + 配置热同步 + 完整数据自画像）。好感度上限 200，亲密度按好感度百分比派生。v2.17 新增个性化训练模块：人格微调（20参数隐式训练+稳定化）、知识库（6类知识情景捕捉）、语言风格（三阶段训练+快照管理）、私人记忆（5种记忆类型+检索审计）。"
version: "2.19"
